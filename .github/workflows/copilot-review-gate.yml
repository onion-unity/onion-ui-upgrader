name: Copilot Review Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  pull-requests: read

concurrency:
  group: copilot-review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  copilot-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check Copilot reviewed the head commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BOT: copilot-pull-request-reviewer[bot]
        # Copilot's review doesn't trigger pull_request_review, so wait for it here.
        run: |
          for i in $(seq 1 30); do   # 30s x 30 = up to 15 min
            ids=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
              --jq ".[] | select(.user.login == \"$BOT\" and .commit_id == \"$HEAD\") | .id")
            if [ -n "$ids" ]; then
              echo "Copilot reviewed $HEAD."
              exit 0
            fi
            echo "Waiting for Copilot review of $HEAD... ($i/30)"
            sleep 30
          done
          echo "::error::Copilot did not review $HEAD within 15 minutes."
          exit 1
